version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: resolvenow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # We don't set POSTGRES_DB because we have multiple DBs created in init.sql
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
