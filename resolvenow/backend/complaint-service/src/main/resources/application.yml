server:
  port: 8082

spring:
  application:
    name: COMPLAINT-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/complaint_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Vedesh@555}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
